<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Portal — OpenWorld</title>
  <meta name="description" content="Community knowledge frames on OpenWorld. Create, explore, and contribute to living workspaces.">
  <link rel="stylesheet" href="/src/styles/core.css">
  <link rel="stylesheet" href="/src/styles/knowledge.css">
  <link rel="stylesheet" href="/src/styles/user-badge.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="container nav__inner">
      <a href="/" class="nav__logo">
        <span class="nav__mark">◈</span> OpenWorld
      </a>
      <ul class="nav__links">
        <li><a href="/">Portal</a></li>
        <li><a href="/pillars/community/">Community</a></li>
        <li><a href="/pillars/knowledge/" style="color: var(--text);">Knowledge</a></li>
      </ul>
      <div class="user-badge" id="userBadge"></div>
    </div>
  </nav>

  <div class="knowledge-layout">

    <!-- Header -->
    <header class="knowledge-header">
      <div class="knowledge-header__top">
        <div>
          <h1>Knowledge Portal</h1>
          <p class="knowledge-header__tagline">Living workspaces for every discipline. Create a frame, build knowledge together.</p>
        </div>
        <button class="btn btn--primary" id="createFrameBtn">+ Create Frame</button>
      </div>
    </header>

    <!-- Toolbar -->
    <div class="knowledge-toolbar">
      <input type="text" class="knowledge-search" id="knowledgeSearch" placeholder="Search frames...">
      <div class="category-tabs" id="categoryTabs">
        <button class="category-tab active" data-category="all">All</button>
        <button class="category-tab" data-category="coding">Coding</button>
        <button class="category-tab" data-category="art">Art</button>
        <button class="category-tab" data-category="music">Music</button>
        <button class="category-tab" data-category="writing">Writing</button>
        <button class="category-tab" data-category="engineering">Engineering</button>
        <button class="category-tab" data-category="photography">Photography</button>
        <button class="category-tab" data-category="design">Design</button>
        <button class="category-tab" data-category="science">Science</button>
        <button class="category-tab" data-category="craft">Craft</button>
        <button class="category-tab" data-category="other">Other</button>
      </div>
      <span class="text-dim" style="font-size: 0.75rem; white-space: nowrap;" id="frameCount"></span>
    </div>

    <!-- Frames Grid -->
    <div class="frames-grid" id="framesGrid">
      <p class="text-dim" style="padding: var(--sp-4);">Loading frames...</p>
    </div>

  </div>

  <script type="module" src="/src/knowledge.js"></script>
</body>
</html>
